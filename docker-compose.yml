# The whole CRM on one host: database, API, front end.
#
# Sized for the 16 GB / 4 vCPU box. Postgres sits alongside the app rather than
# in a managed service because this dataset is small enough to live entirely in
# RAM, and a managed instance would cost more than the box it would serve.
#
# Nothing here carries a secret. Every credential comes from .env, which is not
# committed — see .env.example for what has to be in it.

services:
  db:
    # pgvector ships in this image, so nothing has to be compiled on the host.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Deliberately not published to the host. Only the API reaches it, over the
    # compose network — a database on a public port is how these get found.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./BullEvents.Api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: >-
        Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: BullEvents.Api
      Jwt__Audience: BullEvents.Client
      Cors__AllowedOrigins__0: ${PUBLIC_WEB_URL}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./bull-realty-crm
      args:
        # Baked into the browser bundle at build time, so this is the URL the
        # customer's browser will call — not the compose-internal one.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  db-data:
